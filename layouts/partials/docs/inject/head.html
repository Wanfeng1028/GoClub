<script>
  (function() {
    const theme = localStorage.getItem('theme') || 'auto';
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    if (theme === 'dark' || (theme === 'auto' && darkQuery.matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
